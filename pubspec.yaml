name: food_delivery_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.2


dependencies:
  flutter:
    sdk: flutter
  
  flutter_native_splash: ^2.4.8
  flutter_svg: ^2.3.2
  get: ^4.7.3



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/onboarding/
    - assets/onboarding/logo/
    - assets/onboarding/images/
    - assets/icons/


  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700

 